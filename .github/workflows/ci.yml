name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify version metadata
        shell: pwsh
        run: ./scripts/Verify-Version.ps1

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go formatting
        shell: bash
        run: |
          files="$(gofmt -l $(git ls-files '*.go'))"
          test -z "$files" || { echo "$files"; exit 1; }
      - name: Test, vet, and build Go components
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out
          go vet ./...
          go build ./cmd/server ./cmd/web
      - name: Check concurrent components for data races
        env:
          CGO_ENABLED: "1"
        run: >-
          go test -race -count=1
          ./internal/application/gateway
          ./internal/application/usage
          ./internal/infrastructure/gatewaycache
          ./internal/infrastructure/logging
          ./internal/transport/http
      - name: Verify sqlc output
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          sqlc generate
          git diff --exit-code -- internal/infrastructure/postgres/dbgen

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: zentrola
          POSTGRES_USER: zentrola
          POSTGRES_PASSWORD: integration-only
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zentrola -d zentrola"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ZENTROLA_INTEGRATION: "1"
      ZENTROLA_REDIS_INTEGRATION: "1"
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: zentrola
      POSTGRES_USER: zentrola
      POSTGRES_PASSWORD: integration-only
      POSTGRES_SSLMODE: disable
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_DB: "2"
      REDIS_PASSWORD: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run PostgreSQL and Redis integration tests
        run: >-
          go test -count=1
          ./internal/infrastructure/postgres
          ./internal/infrastructure/gatewaycache

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test

  license-inventory:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Verify third-party license inventory
        shell: pwsh
        run: |
          ./scripts/Sync-ThirdPartyLicenses.ps1
          git diff --exit-code -- THIRD_PARTY_NOTICES.md third_party_licenses

  release-bundle:
    needs: [version-metadata, backend, backend-integration, frontend, license-inventory]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Build Linux release bundle
        run: go run ./cmd/release -target-os linux -architecture amd64 -skip-npm-install
      - name: Verify release metadata
        run: |
          test -x dist/linux/amd64/zentrola
          test -x dist/linux/amd64/zentrola-web
          test -f dist/linux/amd64/dist/index.html
          test -f dist/linux/amd64/VERSION
          test -f dist/linux/amd64/LICENSE
          test -f dist/linux/amd64/NOTICE
          test -f dist/linux/amd64/THIRD_PARTY_NOTICES.md
          test -d dist/linux/amd64/third_party_licenses
      - name: Build application image
        run: |
          docker build \
            --build-arg TARGETARCH=amd64 \
            --build-arg APP_VERSION="$(tr -d '\r\n' < VERSION)" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t zentrola:ci .
