name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify version metadata
        shell: pwsh
        run: ./scripts/Verify-Version.ps1
      - id: version
        shell: bash
        run: |
          version="$(sed -n 's/^APP_VERSION=//p' .env.example | head -n 1 | tr -d '\r')"
          tag="${GITHUB_REF_NAME#v}"
          test "$tag" = "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

  bundles:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_os: linux
            architecture: amd64
            format: tar
          - target_os: linux
            architecture: arm64
            format: tar
          - target_os: windows
            architecture: amd64
            format: zip
          - target_os: macos
            architecture: amd64
            format: tar
          - target_os: macos
            architecture: arm64
            format: tar
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Build bundle
        run: >-
          go run ./cmd/release
          -target-os ${{ matrix.target_os }}
          -architecture ${{ matrix.architecture }}
          -skip-npm-install
      - name: Package bundle
        shell: bash
        run: |
          base="zentrola-${{ needs.version.outputs.value }}-${{ matrix.target_os }}-${{ matrix.architecture }}"
          source="dist/${{ matrix.target_os }}/${{ matrix.architecture }}"
          if [ "${{ matrix.format }}" = zip ]; then
            (cd "$source" && zip -qr "$GITHUB_WORKSPACE/$base.zip" .)
          else
            tar -C "$source" -czf "$base.tar.gz" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target_os }}-${{ matrix.architecture }}
          path: zentrola-${{ needs.version.outputs.value }}-${{ matrix.target_os }}-${{ matrix.architecture }}.*
          if-no-files-found: error

  publish:
    needs: [version, bundles]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: bundle-*
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      # syft 经 Go 模块代理安装并固定版本，不依赖 GitHub Release 下载。
      - name: Install syft
        run: GOBIN="$RUNNER_TEMP/bin" go install github.com/anchore/syft/cmd/syft@v1.57.0
      # syft 不解压发布包，因此先解开 linux/amd64 发布包：Go 二进制的 buildinfo
      # 提供后端模块，web 锁文件提供打包进 dist/ 的前端运行时依赖。
      - name: Generate SBOM
        shell: bash
        run: |
          version="${{ needs.version.outputs.value }}"
          source="$RUNNER_TEMP/sbom-source"
          mkdir -p "$source/web"
          tar -xzf "artifacts/zentrola-$version-linux-amd64.tar.gz" -C "$source"
          cp web/package.json web/package-lock.json "$source/web/"
          "$RUNNER_TEMP/bin/syft" scan "dir:$source" \
            --source-name zentrola --source-version "$version" \
            -o "cyclonedx-json=artifacts/zentrola-$version-sbom.cdx.json"
          count="$(jq '.components | length' "artifacts/zentrola-$version-sbom.cdx.json")"
          echo "SBOM components: $count"
          test "$count" -gt 0
      - name: Create checksums
        working-directory: artifacts
        run: sha256sum zentrola-* > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          artifacts/*
          --verify-tag
          --generate-notes
          --title "Zentrola ${{ needs.version.outputs.value }}"
