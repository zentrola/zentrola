name: Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - site/**
      - docs/assets/admin-console.png
      - web/public/favicon.svg
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site/assets
          cp -R site/. _site/
          cp docs/assets/admin-console.png _site/assets/admin-console.png
          cp web/public/favicon.svg _site/assets/favicon.svg
          test -f _site/index.html
          test -f _site/en/index.html
          test -f _site/assets/style.css
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
