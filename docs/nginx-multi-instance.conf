# 放在 Nginx 的 http {} 中；替换域名、证书路径和实例地址。
# Backend 与 Admin Web 均在仅允许 Nginx 访问的内网运行。
upstream zentrola_backend {
    least_conn;
    server 10.0.0.11:9527 max_fails=3 fail_timeout=10s;
    server 10.0.0.12:9527 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream zentrola_web {
    server 10.0.0.11:9528 max_fails=3 fail_timeout=10s;
    server 10.0.0.12:9528 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name zentrola.example.com;
    return 301 https://zentrola.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name zentrola.example.com;

    ssl_certificate /etc/letsencrypt/live/zentrola.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zentrola.example.com/privkey.pem;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;

    # 与所有 Backend 的 GATEWAY_MAX_BODY_BYTES=67108864 对齐。
    # 关闭响应缓冲，确保模型 SSE 事件及时送达客户端。
    location /v1/ {
        client_max_body_size 64m;
        proxy_buffering off;
        proxy_read_timeout 16m;
        proxy_pass http://zentrola_backend;
    }

    location /anthropic/ {
        client_max_body_size 64m;
        proxy_buffering off;
        proxy_read_timeout 16m;
        proxy_pass http://zentrola_backend;
    }

    location /api/ {
        proxy_pass http://zentrola_backend;
    }

    location / {
        proxy_pass http://zentrola_web;
    }
}
