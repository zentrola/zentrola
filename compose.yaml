name: zentrola

# 快速部署：只需要修改下面四项，然后执行 docker compose up -d。
# 不要把填写了真实密码和密钥的 compose.yaml 提交到公开仓库。
x-required-settings:
  postgres-password: &postgres-password "REPLACE_WITH_STRONG_POSTGRES_PASSWORD"
  redis-password: &redis-password "REPLACE_WITH_STRONG_REDIS_PASSWORD"
  admin-jwt-secret: &admin-jwt-secret "REPLACE_WITH_BASE64_32_BYTE_SECRET"
  master-key-file: &master-key-file |
    MASTER_KEY=REPLACE_WITH_BASE64_32_BYTE_KEY

x-logging: &default-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:17.11-alpine
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_DB: zentrola
      POSTGRES_USER: zentrola
      POSTGRES_PASSWORD: *postgres-password
      TZ: UTC
      PGTZ: UTC
    logging: *default-logging
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAqc "SELECT 1" | grep -qx 1'
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.11-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - *redis-password
    environment:
      REDIS_PASSWORD: *redis-password
    logging: *default-logging
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG'
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: longjianghu/zentrola:latest
    command: ["backend"]
    ports:
      - "9527:9527"
    environment:
      APP_ENV: prod
      HTTP_ADDR: ":9527"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: zentrola
      POSTGRES_USER: zentrola
      POSTGRES_PASSWORD: *postgres-password
      POSTGRES_SSLMODE: disable
      POSTGRES_MAX_CONNS: "10"
      MIGRATIONS_AUTO_APPLY: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "2"
      REDIS_PASSWORD: *redis-password
      ADMIN_JWT_SECRET: *admin-jwt-secret
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:9528
    configs:
      - source: zentrola_master_key
        target: /app/.env
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/zentrola", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - zentrola_data:/app/data
    restart: unless-stopped

  web:
    image: longjianghu/zentrola:latest
    command:
      - web
      - --api
      - http://127.0.0.1:9527
      - --gateway
      - http://127.0.0.1:9527
    ports:
      - "9528:9528"
    environment:
      WEB_ADDR: ":9528"
      WEB_API_BASE_URL: http://127.0.0.1:9527
      WEB_GATEWAY_BASE_URL: http://127.0.0.1:9527
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

configs:
  zentrola_master_key:
    content: *master-key-file

volumes:
  postgres_data:
  redis_data:
  zentrola_data:
