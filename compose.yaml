name: zentrola

# 可选的 PostgreSQL 快速安装示例；Backend 和 Admin Web 均直接运行发布包中的可执行文件。

x-logging: &default-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISHED_PORT:-15432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zentrola}
      POSTGRES_USER: ${POSTGRES_USER:-zentrola}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: UTC
      PGTZ: UTC
    logging: *default-logging
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
